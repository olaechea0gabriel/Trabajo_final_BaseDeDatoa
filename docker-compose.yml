services:
  db:
    image: postgres:16-alpine
    container_name: psiq_ucsp_postgres
    restart: always
    environment:
      POSTGRES_USER: psiq_final_db
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: consultorio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/tablas.sql:/docker-entrypoint-initdb.d/01_tablas.sql

volumes:
  postgres_data:
